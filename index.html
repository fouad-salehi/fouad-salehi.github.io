<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fouad Salehi — Software Developer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #e8e8ec;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #05050a;
    overflow-x: hidden;
    position: relative;
  }

  .galaxy-bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(88, 28, 135, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(30, 64, 175, 0.35) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 15% 70%, rgba(190, 24, 93, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 90%, rgba(67, 56, 202, 0.3) 0%, transparent 60%),
      #05050a;
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 80px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #e0e7ff, transparent),
      radial-gradient(1px 1px at 240px 200px, #fff, transparent),
      radial-gradient(1px 1px at 320px 90px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 400px 260px, #c7d2fe, transparent),
      radial-gradient(1px 1px at 480px 40px, #fff, transparent),
      radial-gradient(1px 1px at 560px 180px, #fff, transparent),
      radial-gradient(1px 1px at 640px 300px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 720px 100px, #fbcfe8, transparent),
      radial-gradient(1px 1px at 800px 220px, #fff, transparent),
      radial-gradient(1px 1px at 880px 60px, #fff, transparent),
      radial-gradient(1px 1px at 960px 340px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 1040px 140px, #ddd6fe, transparent),
      radial-gradient(1px 1px at 1120px 280px, #fff, transparent),
      radial-gradient(1px 1px at 1200px 80px, #fff, transparent),
      radial-gradient(1px 1px at 1280px 380px, #fff, transparent),
      radial-gradient(1px 1px at 1360px 200px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 1440px 320px, #c7d2fe, transparent),
      radial-gradient(1px 1px at 1520px 120px, #fff, transparent);
    background-size: 1600px 400px;
    background-repeat: repeat;
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  .stars-layer-2 {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image:
      radial-gradient(1px 1px at 60px 80px, #a5b4fc, transparent),
      radial-gradient(1px 1px at 200px 160px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 340px 40px, #fff, transparent),
      radial-gradient(1px 1px at 460px 240px, #fbcfe8, transparent),
      radial-gradient(1px 1px at 600px 120px, #fff, transparent),
      radial-gradient(1px 1px at 740px 320px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 880px 160px, #ddd6fe, transparent),
      radial-gradient(1px 1px at 1020px 60px, #fff, transparent),
      radial-gradient(1px 1px at 1160px 260px, #fff, transparent),
      radial-gradient(1px 1px at 1300px 140px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 1440px 340px, #c7d2fe, transparent);
    background-size: 1600px 400px;
    background-repeat: repeat;
    animation: twinkle 9s ease-in-out infinite alternate-reverse;
    opacity: 0.7;
  }

  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .nebula {
    position: fixed;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(circle 400px at 30% 40%, rgba(124, 58, 237, 0.15), transparent 70%),
      radial-gradient(circle 500px at 70% 60%, rgba(219, 39, 119, 0.1), transparent 70%),
      radial-gradient(circle 350px at 50% 80%, rgba(37, 99, 235, 0.12), transparent 70%);
    animation: drift 30s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -20px) scale(1.05); }
  }

  header {
    text-align: center;
    padding: 90px 20px 50px;
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand {
    display: inline-block;
    font-size: 3.4rem;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(120deg, #c4b5fd 0%, #f472b6 40%, #818cf8 70%, #a78bfa 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
    text-shadow: 0 0 60px rgba(167, 139, 250, 0.3);
  }
  .brand .accent {
    display: block;
    font-size: 0.42em;
    font-weight: 500;
    letter-spacing: 2px;
    margin-top: 12px;
    background: linear-gradient(90deg, #7a7a9a, #c4b5fd, #7a7a9a);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 8s linear infinite reverse;
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  .tagline {
    max-width: 560px;
    margin: 22px auto 0;
    color: #9a9ab8;
    font-size: 1rem;
    line-height: 1.9;
    letter-spacing: 0.2px;
  }
  .tagline .highlight {
    color: #e0d7ff;
    font-weight: 600;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .socials a {
    width: 46px; height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(21, 21, 29, 0.6);
    border: 1px solid rgba(167, 139, 250, 0.2);
    border-radius: 13px;
    color: #c4b5fd;
    backdrop-filter: blur(10px);
    transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .socials a:hover {
    background: rgba(30, 30, 45, 0.9);
    border-color: #a78bfa;
    transform: translateY(-4px);
    box-shadow: 0 10px 28px rgba(167, 139, 250, 0.4);
  }
  .socials svg { width: 22px; height: 22px; fill: currentColor; }

  footer {
    text-align: center;
    padding: 26px 20px;
    border-top: 1px solid rgba(167, 139, 250, 0.1);
    color: #6a6a88;
    font-size: 0.82rem;
    backdrop-filter: blur(10px);
    background: rgba(10, 10, 15, 0.5);
    letter-spacing: 0.4px;
  }
  footer .rights {
    color: #8a8ab0;
    font-weight: 500;
  }
  footer .divider {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #a78bfa;
    margin: 0 10px;
    vertical-align: middle;
  }
  footer .made {
    color: #5a5a72;
    font-size: 0.76rem;
  }

  @media (max-width: 600px) {
    header { padding: 60px 16px 35px; }
    .brand { font-size: 2.4rem; }
    .brand .accent { font-size: 0.45em; letter-spacing: 1px; }
    .tagline { font-size: 0.9rem; }
    footer { font-size: 0.76rem; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="nebula"></div>
